spring.application.name=openai
server.port=8082
logging.pattern.console=%green(%d{HH:mm:ss.SSS}) %blue(%-5level) %red([%thread]) %yellow(%logger{15}) - %msg%n

# NVIDIA LLM API (OpenAI-compatible)
# Spring AI 2.0 appends /chat/completions, so base-url must include /v1
spring.ai.openai.api-key=${NVIDIA_API_KEY}
spring.ai.openai.base-url=https://integrate.api.nvidia.com/v1
spring.ai.openai.chat.model=openai/gpt-oss-120b
spring.ai.openai.chat.max-tokens=4096
spring.ai.openai.embedding.enabled=false
spring.ai.model.audio.speech=none
spring.ai.model.audio.transcription=none